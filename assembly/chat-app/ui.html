<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>chat-app v2</title>
<link rel="stylesheet" href="ui.css" />
</head>
<body>

<header>
  <span class="badge">chat-app v2</span>
  <div id="nick-row">
    <span>you:</span>
    <span id="me"></span>
  </div>
</header>

<div id="layout">
  <nav id="side" aria-label="Conversations">
    <h3>Rooms</h3>
    <div id="room-list"></div>
    <h3>Direct</h3>
    <div id="direct-list"></div>
  </nav>
  <div id="main">
    <div id="conv-title">
      <button id="menu-btn" type="button" aria-label="Conversations">☰</button>
      <span id="conv-name"></span>
      <button id="leave-btn" type="button">Close</button>
    </div>
    <div id="log"><div id="empty" class="sys"></div></div>
    <form id="form" autocomplete="off">
      <input id="msg" type="text" placeholder="Message" autocapitalize="sentences" />
      <button id="image-btn" type="button" title="Attach image" aria-label="Attach image">📎</button>
      <button class="primary" type="submit">Send</button>
      <input id="image-file" type="file" accept="image/*" hidden />
    </form>
  </div>
</div>

<div id="lightbox" role="dialog" aria-label="Image viewer"><img id="lightbox-img" alt="" /></div>

<script src="ui.js"></script>
</body>
</html>
