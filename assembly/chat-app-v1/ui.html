<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>chat-app v1</title>
<style>
  /* ── cyberpunk theme — v1 is the "retro install" that looks distinctly
       different from v2, so swapping installs is visible at a glance. ── */
  :root {
    --bg:        #07030f;
    --panel:    #0e0820;
    --panel-2: #160c2c;
    --line:      #2a134d;
    --line-2:  #4a1f7a;
    --text:      #e6dcff;
    --muted:    #9d7bc9;
    --neon:      #ff2e88;       /* hot pink */
    --neon-2:  #00f5ff;         /* electric cyan */
    --neon-3:  #b14bff;         /* violet glow */
    --me:        #00f5ff;
    --peer:    #ff2e88;
    --mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--mono);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.45;
    letter-spacing: 0.02em;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    -webkit-text-size-adjust: 100%;
    background-image:
      radial-gradient(ellipse at top left,    rgba(255, 46, 136, 0.10), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(0, 245, 255, 0.10), transparent 55%),
      linear-gradient(rgba(177, 75, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(177, 75, 255, 0.04) 1px, transparent 1px);
    background-size: auto, auto, 32px 32px, 32px 32px;
    background-attachment: fixed;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.6em;
    padding: 0.55em 0.8em;
    border-bottom: 1px solid var(--line);
    background:
      linear-gradient(90deg, rgba(255, 46, 136, 0.08), rgba(0, 245, 255, 0.06)),
      var(--panel);
    box-shadow: 0 1px 0 rgba(255, 46, 136, 0.25), 0 2px 14px rgba(0, 0, 0, 0.4);
  }
  .badge {
    display: inline-block;
    padding: 0.2em 0.7em;
    background: transparent;
    color: var(--neon);
    border: 1px solid var(--neon);
    border-radius: 999px;
    font-size: 0.72em;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    box-shadow: 0 0 8px rgba(255, 46, 136, 0.35), inset 0 0 6px rgba(255, 46, 136, 0.18);
    text-shadow: 0 0 6px rgba(255, 46, 136, 0.6);
  }
  #room {
    min-width: 0;
    font-family: var(--mono);
    font-size: 0.85em;
    padding: 0.2em 0.5em;
    background: var(--panel-2);
    color: var(--neon-2);
    border: 1px solid var(--line-2);
    border-radius: 4px;
  }

  #log {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0.7em 0.9em;
    overscroll-behavior: contain;
    scroll-behavior: smooth;
  }
  #log div { padding: 2px 0; word-wrap: break-word; word-break: break-word; }
  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
  #log::-webkit-scrollbar-thumb:hover { background: var(--neon-3); }

  #form {
    display: flex;
    gap: 0.45em;
    align-items: flex-end;
    padding: 0.55em 0.75em calc(0.55em + env(safe-area-inset-bottom));
    background:
      linear-gradient(90deg, rgba(0, 245, 255, 0.06), rgba(255, 46, 136, 0.06)),
      var(--panel);
    border-top: 1px solid var(--line);
    box-shadow: 0 -1px 0 rgba(0, 245, 255, 0.25);
  }
  #msg {
    flex: 1;
    min-width: 0;
    font-family: var(--mono);
    padding: 0.6em 0.85em;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line-2);
    border-radius: 4px;
    font-size: 1em;
    min-height: 40px;
    letter-spacing: 0.02em;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
  }
  #msg::placeholder { color: var(--muted); }
  #msg:focus {
    outline: none;
    border-color: var(--neon-2);
    background: #0d0822;
    box-shadow: 0 0 0 1px var(--neon-2), 0 0 12px rgba(0, 245, 255, 0.35);
  }

  button {
    font-family: var(--mono);
    background: transparent;
    color: var(--neon);
    border: 1px solid var(--neon);
    border-radius: 4px;
    padding: 0 1.1em;
    cursor: pointer;
    font-size: 0.9em;
    min-height: 40px;
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    box-shadow: 0 0 10px rgba(255, 46, 136, 0.25), inset 0 0 6px rgba(255, 46, 136, 0.12);
    text-shadow: 0 0 6px rgba(255, 46, 136, 0.55);
    transition: color 0.15s, background 0.15s, box-shadow 0.15s, border-color 0.15s, text-shadow 0.15s;
  }
  button:hover {
    color: #07030f;
    background: var(--neon);
    border-color: var(--neon);
    box-shadow: 0 0 18px rgba(255, 46, 136, 0.65), 0 0 32px rgba(255, 46, 136, 0.35);
    text-shadow: none;
  }
  button:active { transform: translateY(1px); }

  .me {
    color: var(--me);
    text-shadow: 0 0 6px rgba(0, 245, 255, 0.55);
  }
  .peer {
    color: var(--peer);
    text-shadow: 0 0 6px rgba(255, 46, 136, 0.55);
  }
  .sys { color: var(--muted); font-size: 0.85em; letter-spacing: 0.05em; }
  .line-author { font-weight: 600; margin-right: 0.4em; }

  @media (max-width: 720px) {
    body { font-size: 14px; }
    #log { padding: 0.55em 0.7em; }
    #msg { font-size: 16px; }
    header { padding: 0.45em 0.65em; }
  }
</style>
</head>
<body>

<header>
  <span class="badge">// chat-app v1 :: text-only</span>
  <select id="room" aria-label="Room to write to" hidden></select>
</header>

<div id="log"></div>

<form id="form" autocomplete="off">
  <input id="msg" type="text" placeholder="Message" autocapitalize="sentences" />
  <button type="submit">Send</button>
</form>

<script>
// chat-app v1 UI. Loaded into a sandboxed iframe by the shell.
//
// With the shell (browser/app-api.js), by postMessage:
//   us → shell: { type: "ready" }              once the UI is wired up
//   us → shell: { type: "call", bytes }        a frame for this app's guest, which sends it
//   us → shell: { type: "conv", room?: hex }   the room being written to, which is who a
//                                              call started now is with
//   shell → us: { type: "render", payload }    what this app's guest answered
//
// With this app's guest (guest.js), as bytes the shell does not read. A frame is room
// text, [5][room 32][utf-8 text], and the guest sends it to that room's members. A render
// is one of:
//   [0][JSON]                             the node's context, ids in hex:
//                                         { me, nick, rooms: [{ id, name, members }], nicks, … }
//   [5][pk_len u8][pk ..][room 32][text]  a message as the module drew it, a peer's or
//                                         this node's own
//
// The one log shows every joined room, each line tagged with its room; the picker in the
// header says which room is written to.
const RENDER_CONTEXT = 0x00;
const CHAT_TYPE_ROOM_TEXT = 0x05;

const log = document.getElementById("log");
const form = document.getElementById("form");
const msgInput = document.getElementById("msg");
const roomSelect = document.getElementById("room");
// This node's key in hex, once the first context says.
let me = null;
// The rooms this node is in, as the context says: room id hex → name.
const rooms = new Map();
// What each peer calls itself, by key hex, and this node under its own key. A nick is the
// shell's, so even a text-only app shows it.
let nicks = {};

function toHex(bytes) {
  return Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
}
function fromHex(hex) {
  return Uint8Array.from(hex.match(/../g), h => parseInt(h, 16));
}
function isAtBottom() {
  return log.scrollHeight - log.scrollTop - log.clientHeight < 32;
}
function appendLine(node) {
  const stick = isAtBottom();
  log.appendChild(node);
  if (stick) log.scrollTop = log.scrollHeight;
}
function print(text, cls) {
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = text;
  appendLine(line);
}
function printMessage(tag, text, cls) {
  const line = document.createElement("div");
  if (cls) line.className = cls;
  const author = document.createElement("span");
  author.className = "line-author";
  author.textContent = tag + ":";
  line.appendChild(author);
  line.appendChild(document.createTextNode(text));
  appendLine(line);
}

/** The node's context: who this node is, and the rooms it is in. */
function onContext(ctx) {
  if (me === null) print(`You are ${ctx.me.slice(0, 8)}. Join a room on the Network tab to start chatting.`, "sys");
  me = ctx.me;
  nicks = { ...ctx.nicks, ...(ctx.nick ? { [ctx.me]: ctx.nick } : {}) };
  const was = roomSelect.value;
  rooms.clear();
  roomSelect.replaceChildren();
  for (const r of ctx.rooms) {
    rooms.set(r.id, r.name);
    roomSelect.appendChild(new Option(r.name, r.id));
  }
  // Keep writing to the same room while this node is still in it.
  if (rooms.has(was)) roomSelect.value = was;
  roomSelect.hidden = rooms.size === 0;
  openRoom();
}

window.addEventListener("message", (ev) => {
  if (ev.source !== window.parent) return;
  const msg = ev.data;
  if (!msg || msg.type !== "render") return;
  const payload = new Uint8Array(msg.payload);
  if (payload[0] === RENDER_CONTEXT) {
    onContext(JSON.parse(new TextDecoder().decode(payload.subarray(1))));
    return;
  }
  let p = 0;
  const type = payload[p++];
  const pkLen = payload[p++];
  if (p + pkLen > payload.length) return;
  const pk = toHex(payload.slice(p, p + pkLen)); p += pkLen;
  const body = payload.slice(p);
  if (type !== CHAT_TYPE_ROOM_TEXT || body.length < 32) return;
  // The guest draws a peer's message only from someone in its room; what is left to tell
  // here is which room that is.
  const room = rooms.get(toHex(body.slice(0, 32)));
  if (room === undefined) return;
  const who = nicks[pk] ? `${nicks[pk]} (${pk.slice(0, 8)})` : pk.slice(0, 8);
  printMessage(`#${room} ${who}`, new TextDecoder().decode(body.slice(32)), pk === me ? "me" : "peer");
});

/** Tell the shell which room is written to, or that there is none. */
function openRoom() {
  const room = roomSelect.value;
  msgInput.placeholder = rooms.has(room) ? `Message #${rooms.get(room)}` : "Join a room to write";
  window.parent.postMessage(rooms.has(room) ? { type: "conv", room } : { type: "conv" }, "*");
}
roomSelect.addEventListener("change", openRoom);

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = msgInput.value;
  const room = roomSelect.value;
  if (!text || !rooms.has(room)) return;
  const content = new TextEncoder().encode(text);
  const frame = new Uint8Array(1 + 32 + content.length);
  frame[0] = CHAT_TYPE_ROOM_TEXT;
  frame.set(fromHex(room), 1);
  frame.set(content, 33);
  window.parent.postMessage({ type: "call", bytes: frame }, "*");
  msgInput.value = "";
  msgInput.focus();
});

window.parent.postMessage({ type: "ready" }, "*");
msgInput.focus();
</script>
</body>
</html>
